apiVersion: v1
kind: Pod
metadata:
  name: "{{ include "earthverticaldatumwebapp.fullname" . }}-test-connection"
  labels:
    {{- include "earthverticaldatumwebapp.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: wget
      image: busybox
      command: ["wget"]
      args: ["{{ include "earthverticaldatumwebapp.fullname" . }}:{{ .Values.service.port }}/EarthVerticalDatum/webapp/health/live"]
  restartPolicy: Never
