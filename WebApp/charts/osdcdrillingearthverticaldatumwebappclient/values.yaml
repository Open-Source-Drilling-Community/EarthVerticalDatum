replicaCount: 1
nameOverride: "osdcdrillingearthverticaldatumwebappclient"
fullnameOverride: osdcearthverticaldatumwebappclient
image:
  repository: docker.io/digiwells/osdcdrillingearthverticaldatumwebappclient
  tag: "stable"
  pullPolicy: Always
imagePullSecrets: []
serviceAccount:
  create: true
  annotations: {}
  name: ""
podAnnotations: {}
podLabels: {}
podSecurityContext: {}
securityContext: {}
service:
  type: ClusterIP
  port: 80
  sessionAffinity: ClientIP
  annotations:
    description: "A web application for bidirectional conversion between EGM84 mean-sea-level and WGS84 ellipsoidal depths"
configuration:
  earthVerticalDatumHostURL: http://osdcearthverticaldatumservice/
  unitConversionHostURL: http://osdcunitconversionservice/
resources: {}
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 100
  targetCPUUtilizationPercentage: 80
ingress:
  enabled: true
  className: public
  annotations:
    nginx.ingress.kubernetes.io/use-regex: "true"
  hosts:
    - host: localhost
      paths:
        - path: /(?i)earthverticaldatum/webapp
          pathType: ImplementationSpecific
    - host: dev.digiwells.no
      paths:
        - path: /(?i)earthverticaldatum/webapp
          pathType: ImplementationSpecific
    - host: app.digiwells.no
      paths:
        - path: /(?i)earthverticaldatum/webapp
          pathType: ImplementationSpecific
    - host: awe.web.intra.norceresearch.no
      paths:
        - path: /(?i)earthverticaldatum/webapp
          pathType: ImplementationSpecific
  tls: []
probes:
  enabled: false
nodeSelector: {}
tolerations: []
affinity: {}
